name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate doublet-detection pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=lee-H1208&repo=doublet-detection&theme=tokyonight
          path: profile/pin-doublet-detection.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI-Studio-Project pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=Snowflake-1A-BreakThroughTech&repo=AI-Studio-Project&theme=tokyonight
          path: profile/pin-ai-studio-project.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image-classification pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=lee-H1208&repo=image-classification&theme=tokyonight
          path: profile/pin-image-classification.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate doublet-detection-analysis pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=lee-H1208&repo=doublet-detection-analysis&theme=tokyonight
          path: profile/pin-doublet-analysis.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README cards [skip ci]"
          file_pattern: "profile/*.svg"
